models:
  - name: stg_jaffle_shop__customers
    description: one unique cust per row 
    columns:
      - name: customer_id
        description: primary key
        data_tests:
          - unique
          - not_null
  - name: stg_jaffle_shop__orders
    columns:
      - name: order_id
        data_tests:
          - unique
          - not_null
      - name: status
        description: "{{doc('order_status') }}"
        data_tests:
          - accepted_values:
              arguments:
                values: ['returned','completed','return_pending','shipped','placed']
      - name: customer_id
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_jaffle_shop__customers')
                field: customer_id
              